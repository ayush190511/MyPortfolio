<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="logoMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>
    <linearGradient id="markInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="100%" stop-color="#0C0D14" />
    </linearGradient>
  </defs>

  <!-- Left Logo Mark (Squircle Badge) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#markInner)" stroke="url(#logoMarkGrad)" stroke-width="2"/>
    
    <!-- Constellation lines -->
    <g opacity="0.35" stroke="#64D2FF" stroke-width="1.2">
      <line x1="12" y1="18" x2="28" y2="12"/>
      <line x1="28" y1="12" x2="44" y2="18"/>
      <line x1="12" y1="18" x2="28" y2="30"/>
      <line x1="44" y1="18" x2="28" y2="30"/>
      <circle cx="12" cy="18" r="2.5" fill="#0A84FF"/>
      <circle cx="28" cy="12" r="2.5" fill="#64D2FF"/>
      <circle cx="44" cy="18" r="2.5" fill="#BF5AF2"/>
    </g>

    <text x="28" y="41" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="-1">AM</text>
    <circle cx="28" cy="49" r="2" fill="#30D158"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(72, 14)">
    <text x="0" y="20" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">Ayush Mishra</text>
    <text x="0" y="36" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="0.2">AI RESEARCHER • DSCE</text>
  </g>
</svg>
