<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>
    <linearGradient id="favInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A26" />
      <stop offset="100%" stop-color="#0B0C12" />
    </linearGradient>
  </defs>
  
  <!-- Outer Squircle (Apple Icon style) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favInner)" stroke="url(#favGrad)" stroke-width="2.5" />
  
  <!-- Neural AI Nodes / Connections -->
  <g opacity="0.4" stroke="#64D2FF" stroke-width="1.2">
    <line x1="14" y1="20" x2="32" y2="14"/>
    <line x1="32" y1="14" x2="50" y2="20"/>
    <line x1="14" y1="20" x2="32" y2="34"/>
    <line x1="50" y1="20" x2="32" y2="34"/>
    <circle cx="14" cy="20" r="2.5" fill="#0A84FF"/>
    <circle cx="32" cy="14" r="2.5" fill="#64D2FF"/>
    <circle cx="50" cy="20" r="2.5" fill="#BF5AF2"/>
  </g>
  
  <!-- Modern Bold Monogram "AM" -->
  <text x="32" y="44" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="22" font-weight="900" letter-spacing="-1">AM</text>
  
  <!-- Subtle Glowing Core Dot -->
  <circle cx="32" cy="53" r="2" fill="#30D158" />
</svg>
