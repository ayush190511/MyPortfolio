<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#BF5AF2" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(10,132,255,0.4)" />
      <stop offset="100%" stop-color="rgba(191,90,242,0.1)" />
    </linearGradient>
  </defs>

  <!-- Base Circle with Glass Border -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="3.5"/>
  <circle cx="200" cy="200" r="170" fill="url(#accentGlow)"/>

  <!-- Neural Net Constellations / Researcher Aesthetic Background -->
  <g opacity="0.3" stroke="#64D2FF" stroke-width="1.2">
    <line x1="100" y1="120" x2="160" y2="80"/>
    <line x1="160" y1="80" x2="240" y2="90"/>
    <line x1="240" y1="90" x2="300" y2="140"/>
    <line x1="300" y1="140" x2="280" y2="220"/>
    <line x1="100" y1="120" x2="120" y2="200"/>
    <line x1="120" y1="200" x2="200" y2="180"/>
    <line x1="200" y1="180" x2="280" y2="220"/>
    <line x1="160" y1="80" x2="200" y2="180"/>
    <line x1="240" y1="90" x2="200" y2="180"/>
    
    <circle cx="100" cy="120" r="4" fill="#0A84FF"/>
    <circle cx="160" cy="80" r="4" fill="#64D2FF"/>
    <circle cx="240" cy="90" r="4" fill="#BF5AF2"/>
    <circle cx="300" cy="140" r="4" fill="#30D158"/>
    <circle cx="120" cy="200" r="4" fill="#FF9F0A"/>
    <circle cx="200" cy="180" r="6" fill="#FFFFFF"/>
    <circle cx="280" cy="220" r="4" fill="#64D2FF"/>
  </g>

  <!-- Stylized Scholar Monogram / Silhouette -->
  <g transform="translate(110, 100)">
    <!-- Shield / Badge Backing -->
    <path d="M 90 20 L 160 50 L 160 130 C 160 180 90 210 90 210 C 90 210 20 180 20 130 L 20 50 Z" 
          fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Academic Cap / AI Nodes -->
    <path d="M 90 45 L 140 70 L 90 95 L 40 70 Z" fill="#0A84FF" fill-opacity="0.85"/>
    <path d="M 140 70 L 140 95" stroke="#64D2FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="140" cy="98" r="3" fill="#FFD60A"/>
    
    <!-- Central Initials "AM" in Apple-style crisp font -->
    <text x="90" y="165" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="42" font-weight="800" letter-spacing="-1">AM</text>
  </g>

  <!-- Bottom Floating Badge: DSCE ISE -->
  <g transform="translate(75, 325)">
    <rect x="0" y="0" width="250" height="40" rx="20" fill="#161824" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="6" fill="#30D158"/>
    <text x="35" y="25" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Assistant Professor @ DSCE</text>
  </g>
</svg>
