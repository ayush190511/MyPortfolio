<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <style>
      .brand-title-txt { fill: #F5F5F7; }
      .brand-sub-txt { fill: #86868B; }
      @media (prefers-color-scheme: light) {
        .brand-title-txt { fill: #1D1D1F; }
        .brand-sub-txt { fill: #6E6E73; }
      }
    </style>
    <linearGradient id="logoApexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="logoTextWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <linearGradient id="logoVisWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF5AF2" />
      <stop offset="100%" stop-color="#FF2D55" />
    </linearGradient>
  </defs>

  <!-- Left Logo Mark (Vision-Language Prism Apex Squircle Badge) -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#logoApexBg)" stroke="#0A84FF" stroke-width="1.8"/>
    
    <g transform="translate(-5, -5) scale(0.96)">
      <!-- Left Wing (Text/Language Modality) -->
      <polygon points="32,12 14,48 24,48 32,32" fill="url(#logoTextWing)"/>

      <!-- Right Wing (Vision Modality) -->
      <polygon points="32,12 50,48 40,48 32,32" fill="url(#logoVisWing)"/>

      <!-- Center Crossbar Nexus -->
      <polygon points="20,38 44,38 41,32 23,32" fill="#FFFFFF"/>

      <!-- Central Apex Diamond Core -->
      <polygon points="32,12 36,20 32,28 28,20" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(70, 15)">
    <text x="0" y="20" class="brand-title-txt" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="19" font-weight="700" letter-spacing="-0.4">Ayush Mishra</text>
    <text x="0" y="36" class="brand-sub-txt" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="0.08em">AI RESEARCHER</text>
  </g>
</svg>
