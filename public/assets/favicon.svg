<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161824" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>

    <linearGradient id="textWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8AB4F8" />
      <stop offset="100%" stop-color="#4D74EB" />
    </linearGradient>

    <linearGradient id="visWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EA8FE" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- 1. Solid High-Contrast Squircle matching website theme -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#apexBg)" stroke="#4D74EB" stroke-width="2"/>

  <!-- 2. Dual-Wing Vision & Language Fusion -->
  <!-- Left Wing (Text/Language Modality) -->
  <polygon points="32,12 14,48 24,48 32,32" fill="url(#textWing)"/>

  <!-- Right Wing (Vision Modality) -->
  <polygon points="32,12 50,48 40,48 32,32" fill="url(#visWing)"/>

  <!-- Center Crossbar Nexus (Forms the "A" & "M" Bridge) -->
  <polygon points="20,38 44,38 41,32 23,32" fill="#FFFFFF"/>

  <!-- Central Apex Diamond Core -->
  <polygon points="32,12 36,20 32,28 28,20" fill="#FFFFFF"/>
</svg>
